<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Pseudo Classes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Pseudo-Classes</h1>

    <p>
        Pseudo-classes are used to style elements in a particular state.
    </p>

    <h2>Hover Effect</h2>

    <button class="hover-button">
        Hover Me
    </button>


    <h2>Links</h2>

    <a href="#">Click this link</a>


    <h2>Focus</h2>

    <input type="text" placeholder="Click here">


    <h2>First and Last Child</h2>

    <ul>
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
        <li>Last Item</li>
    </ul>


    <h2>Nth Child</h2>

    <div class="items">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>

</body>

</html>
