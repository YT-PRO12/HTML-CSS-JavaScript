<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Borders</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Border Properties</h1>

    <p>Different types of borders using CSS.</p>

    <div class="solid">
        Solid Border
    </div>

    <div class="dashed">
        Dashed Border
    </div>

    <div class="dotted">
        Dotted Border
    </div>

    <div class="rounded">
        Rounded Border
    </div>

    <div class="circle">
        Circle
    </div>

</body>

</html>
