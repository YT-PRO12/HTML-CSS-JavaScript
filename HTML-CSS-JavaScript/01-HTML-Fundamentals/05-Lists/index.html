<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>
</head>

<body>

    <h1>Unordered List</h1>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h1>Ordered List</h1>

    <ol>
        <li>Learn HTML</li>
        <li>Learn CSS</li>
        <li>Learn JavaScript</li>
    </ol>

    <h1>Description List</h1>

    <dl>
        <dt>HTML</dt>
        <dd>Used to structure webpages.</dd>

        <dt>CSS</dt>
        <dd>Used to style webpages.</dd>

        <dt>JavaScript</dt>
        <dd>Used to add functionality.</dd>
    </dl>

</body>

</html>
